<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Conjugaison — French with Alban</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,400;9..144,600;9..144,700&family=DM+Serif+Display&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --cream: #faf7f2;
  --cream-dark: #f0ece4;
  --navy: #0d2b45;
  --red: #c0392b;
  --gold: #c9972a;
  --border: #ddd8ce;
  --text-soft: #666;
  --green: #2e7d4f;
  --green-soft: #e8f4ed;
  --red-soft: #fbeae8;
  --teal: #0d8f80;
  --teal-soft: #e0f3f1;
  --olive: #6f9e2f;
  --olive-soft: #f0f5e8;
  --orange: #d98218;
  --orange-soft: #fdf3e3;
}
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
  min-height: 100vh;
  background: #ffffff;
  font-family: 'Inter', sans-serif;
  color: var(--navy);
  display: flex;
  flex-direction: column;
}

/* HEADER — identique aux autres pages ressources */
header {
  width: 100%;
  padding: 28px 48px;
  border-bottom: 1px solid var(--border);
  display: flex; justify-content: space-between; align-items: center;
  background: #ffffff;
  position: sticky; top: 0; z-index: 100;
}
.logo {
  display: flex; align-items: center; gap: 12px;
  font-family: 'Fraunces', serif; font-size: 1.7rem; font-weight: 600;
  color: var(--navy); white-space: nowrap; text-decoration: none;
}
.logo .red { color: var(--red); }
nav { display: flex; gap: 44px; }
nav a {
  font-size: 1.05rem; font-weight: 500;
  color: var(--navy); text-decoration: none; transition: color 0.2s;
}
nav a:hover { color: var(--red); }

/* MAIN */
main {
  flex: 1; display: flex; justify-content: center;
  padding: 48px 20px 64px;
}
.app { width: 100%; max-width: 640px; }

/* MASTHEAD */
.masthead {
  display: flex; align-items: baseline; justify-content: space-between;
  margin-bottom: 24px; padding-bottom: 16px;
  border-bottom: 1px solid var(--border);
}
.masthead h1 {
  font-family: 'DM Serif Display', serif;
  font-size: 1.8rem; font-weight: 400; margin: 0; color: var(--navy);
}
.masthead .tag {
  font-size: 0.7rem; font-weight: 600; letter-spacing: 0.14em;
  text-transform: uppercase; color: var(--red);
}

/* CARD */
.card {
  background: var(--cream-dark);
  border: 1px solid var(--border);
  border-top: 3px solid var(--navy);
  padding: 32px;
}

/* HOME */
.home h2 {
  font-family: 'Fraunces', serif; font-size: 1.2rem;
  font-weight: 600; margin: 0 0 8px; color: var(--navy);
}
.home p.lede {
  font-size: 0.88rem; line-height: 1.6; color: var(--text-soft);
  font-weight: 300; margin: 0 0 24px;
}
.mode-choice {
  display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 24px;
}
.mode-btn {
  border: 1.5px solid var(--navy); background: transparent;
  padding: 16px 10px; text-align: center; cursor: pointer;
  font-family: 'Inter', sans-serif; transition: all 0.15s;
}
.mode-btn .num {
  display: block; font-family: 'DM Serif Display', serif;
  font-size: 2rem; color: var(--navy);
}
.mode-btn .lbl {
  font-size: 0.68rem; text-transform: uppercase; letter-spacing: 0.1em;
  color: var(--text-soft);
}
.mode-btn:hover, .mode-btn.selected {
  background: var(--navy); color: var(--cream);
  box-shadow: 3px 3px 0 var(--red);
}
.mode-btn:hover .num, .mode-btn.selected .num { color: var(--cream); }
.mode-btn:hover .lbl, .mode-btn.selected .lbl { color: var(--gold); }

.section-label {
  font-size: 0.68rem; font-weight: 600; letter-spacing: 0.16em;
  text-transform: uppercase; color: var(--red); margin-bottom: 10px;
}

/* TENSE PICKER */
.tense-picker { margin-bottom: 24px; }
.tense-choice { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.tense-btn {
  border: 1.5px solid var(--border); background: var(--cream);
  padding: 11px 6px; text-align: center; cursor: pointer;
  font-size: 0.76rem; font-weight: 500; color: var(--text-soft);
  transition: all 0.15s;
}
.tense-btn.selected {
  background: var(--navy); color: var(--cream); border-color: var(--navy);
}
.tense-btn:hover:not(.selected) { border-color: var(--navy); color: var(--navy); }

/* VERB PICKER */
.verb-picker { margin-bottom: 24px; }
.verb-picker-head {
  display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;
}
.verb-picker-toggle {
  font-size: 0.74rem; color: var(--red); cursor: pointer;
  text-decoration: underline; background: none; border: none;
  font-family: 'Inter', sans-serif; font-weight: 500;
}
.verb-all-btn {
  width: 100%; text-align: left; padding: 12px 14px;
  border: 1.5px solid var(--border); background: var(--cream);
  font-size: 0.84rem; color: var(--text-soft); cursor: pointer;
  font-family: 'Inter', sans-serif;
}
.verb-all-btn b { color: var(--navy); font-weight: 600; }
.verb-grid-wrap { border: 1.5px solid var(--border); padding: 12px; background: var(--cream); }
.verb-grid-actions { display: flex; gap: 14px; margin-bottom: 10px; padding-bottom: 10px; border-bottom: 1px dashed var(--border); }
.verb-grid-actions button {
  background: none; border: none; padding: 0; font-size: 0.74rem;
  color: var(--text-soft); text-decoration: underline; cursor: pointer;
  font-family: 'Inter', sans-serif;
}
.verb-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 4px 10px; max-height: 240px; overflow-y: auto; }
.verb-chip { display: flex; align-items: center; gap: 8px; padding: 6px 4px; cursor: pointer; font-size: 0.84rem; }
.verb-chip:hover { background: var(--cream-dark); }
.verb-chip input { accent-color: var(--navy); width: 14px; height: 14px; flex-shrink: 0; }

/* START BTN */
.start-btn {
  width: 100%; padding: 14px; background: var(--red); color: var(--cream);
  border: none; font-family: 'Inter', sans-serif; font-weight: 600;
  font-size: 0.92rem; cursor: pointer; letter-spacing: 0.04em;
  box-shadow: 4px 4px 0 var(--navy); transition: all 0.15s;
}
.start-btn:hover:not(:disabled) { transform: translate(-2px, -2px); box-shadow: 6px 6px 0 var(--navy); }
.start-btn:disabled { opacity: 0.35; cursor: not-allowed; box-shadow: none; }

/* QUIZ */
.quiz-top {
  display: flex; justify-content: space-between; align-items: baseline;
  margin-bottom: 16px; font-size: 0.78rem; color: var(--text-soft);
}
.progress-track {
  height: 3px; background: var(--border); margin-bottom: 28px; overflow: hidden;
}
.progress-fill { height: 100%; background: var(--red); transition: width 0.25s ease; }
.prompt-eyebrow {
  font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.14em;
  color: var(--gold); margin-bottom: 6px; font-weight: 600;
}
.prompt-verb {
  font-family: 'DM Serif Display', serif;
  font-size: 2.4rem; margin: 0 0 4px; line-height: 1.1; color: var(--navy);
}
.prompt-verb .pronoun { color: var(--text-soft); font-size: 1.6rem; }

.field { margin-top: 20px; }
.field label { display: block; font-size: 0.78rem; font-weight: 600; color: var(--text-soft); margin-bottom: 6px; }
.field .opt { font-weight: 300; }
.field input {
  width: 100%; padding: 12px 14px;
  border: 1.5px solid var(--border); background: var(--cream);
  font-family: 'Inter', sans-serif; font-size: 1rem; color: var(--navy);
  outline: none; transition: border-color 0.15s;
}
.field input:focus { border-color: var(--navy); }
.field input.ok { border-color: var(--green); background: var(--green-soft); }
.field input.bad { border-color: var(--red); background: var(--red-soft); }
.field input.half { border-color: var(--gold); background: var(--orange-soft); }

.accent-row { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 8px; }
.accent-btn {
  width: 30px; height: 30px; border: 1.5px solid var(--border);
  background: var(--cream); font-size: 0.9rem; color: var(--navy);
  cursor: pointer; transition: all 0.15s;
}
.accent-btn:hover { border-color: var(--navy); background: var(--cream-dark); }
.accent-btn:disabled { opacity: 0.3; cursor: not-allowed; }

/* REWRITE */
.rewrite {
  margin-top: 18px; padding: 16px;
  border: 1.5px dashed var(--navy); background: var(--cream);
}
.rewrite .rw-label {
  font-size: 0.78rem; font-weight: 600; color: var(--navy); margin-bottom: 4px;
}
.rewrite .rw-hint {
  font-size: 0.74rem; font-weight: 300; color: var(--text-soft); margin-bottom: 10px;
}
.rewrite input {
  width: 100%; padding: 11px 14px;
  border: 1.5px solid var(--border); background: var(--cream-dark);
  font-family: 'Inter', sans-serif; font-size: 1rem; color: var(--navy); outline: none;
}
.rewrite input:focus { border-color: var(--navy); }
.rewrite input.done { border-color: var(--green); background: var(--green-soft); }
.rw-msg { margin-top: 8px; font-size: 0.78rem; font-weight: 600; min-height: 1.1em; }
.rw-msg.ok { color: var(--green); }
.rw-msg.wait { color: var(--text-soft); font-weight: 400; }

.actions { display: flex; gap: 10px; margin-top: 24px; }
.btn { flex: 1; padding: 13px; font-family: 'Inter', sans-serif; font-weight: 600; font-size: 0.9rem; cursor: pointer; border: 1.5px solid var(--navy); transition: all 0.15s; }
.btn-primary { background: var(--navy); color: var(--cream); box-shadow: 3px 3px 0 var(--red); }
.btn-primary:hover:not(:disabled) { transform: translate(-1px, -1px); box-shadow: 4px 4px 0 var(--red); }
.btn-primary:disabled { opacity: 0.35; cursor: not-allowed; box-shadow: none; }
.btn-ghost { background: transparent; color: var(--text-soft); border-color: var(--border); }
.btn-ghost:hover { border-color: var(--navy); color: var(--navy); }

.feedback { margin-top: 16px; padding: 14px 16px; font-size: 0.88rem; line-height: 1.5; border-left: 3px solid; }
.feedback.ok { background: var(--green-soft); color: #1e5c35; border-color: var(--green); }
.feedback.bad { background: var(--red-soft); color: #8b2a20; border-color: var(--red); }
.feedback.half { background: var(--orange-soft); color: #8a5a10; border-color: var(--gold); }
.feedback b { font-weight: 600; }

/* RESULT */
.result h2 { font-family: 'Fraunces', serif; font-size: 1rem; margin: 0 0 4px; color: var(--text-soft); font-weight: 400; }
.result .score { font-family: 'DM Serif Display', serif; font-size: 3.5rem; margin: 4px 0 8px; color: var(--navy); }
.result .score span { font-size: 1.5rem; color: var(--text-soft); }
.result .capped { font-size: 0.74rem; color: var(--text-soft); font-style: italic; margin: -4px 0 10px; }
.mention {
  display: inline-block; font-size: 0.72rem; font-weight: 700;
  letter-spacing: 0.1em; text-transform: uppercase; padding: 5px 12px; margin-bottom: 24px;
  border: 1.5px solid;
}
.m-revoir { background: var(--red-soft); color: var(--red); border-color: var(--red); }
.m-assezbien { background: var(--orange-soft); color: var(--orange); border-color: var(--orange); }
.m-bien { background: var(--olive-soft); color: #566e28; border-color: var(--olive); }
.m-tresbien { background: var(--green-soft); color: var(--green); border-color: var(--green); }
.m-parfait { background: var(--teal-soft); color: var(--teal); border-color: var(--teal); }

.breakdown { border-top: 1px dashed var(--border); padding-top: 14px; margin-top: 6px; max-height: 260px; overflow-y: auto; }
.breakdown-row { display: flex; justify-content: space-between; gap: 10px; font-size: 0.82rem; padding: 6px 0; border-bottom: 1px solid var(--border); }
.breakdown-row .bv { color: var(--navy); }
.breakdown-row .status { flex-shrink: 0; font-weight: 600; }
.status.yes { color: var(--green); }
.status.half { color: var(--gold); }
.status.no { color: var(--red); }

/* FOOTER */
footer {
  width: 100%;
  background: var(--navy); padding: 28px 48px;
  border-top: 3px solid var(--gold);
  display: flex; justify-content: space-between; align-items: center;
}
.footer-logo { font-family: 'Fraunces', serif; font-size: 0.9rem; font-weight: 400; color: var(--cream); }
.footer-copy { font-size: 0.7rem; font-weight: 300; color: rgba(250,247,242,0.4); }

@media (max-width: 720px) {
  header { padding: 18px 20px; flex-wrap: wrap; gap: 12px; }
  .logo { font-size: 1.3rem; }
  nav { gap: 24px; }
  main { padding: 32px 16px 48px; }
  .card { padding: 24px 20px; }
  footer { padding: 22px 20px; }
}
</style>
</head>
<body>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="hex-tri" viewBox="0 0 30 35">
    <clipPath id="clip-hex"><polygon points="15,0 30,8.75 30,26.25 15,35 0,26.25 0,8.75"/></clipPath>
    <g clip-path="url(#clip-hex)">
      <rect x="0" y="0" width="10" height="35" fill="#002395"/>
      <rect x="10" y="0" width="10" height="35" fill="#ffffff"/>
      <rect x="20" y="0" width="10" height="35" fill="#ED2939"/>
    </g>
    <polygon points="15,0 30,8.75 30,26.25 15,35 0,26.25 0,8.75" fill="none" stroke="#0d2b45" stroke-width="2"/>
  </symbol>
</svg>

<header>
  <a href="/" class="logo">
    <svg width="30" height="35" aria-hidden="true"><use href="#hex-tri"/></svg>
    <span>French with <span class="red">Alban</span></span>
  </a>
  <nav>
    <a href="/ressources.html">Retour</a>
    <a href="/">Accueil</a>
  </nav>
</header>

<main>
<div class="app">
  <div class="masthead">
    <h1>Conjugaison</h1>
    <span class="tag">Verbes irréguliers</span>
  </div>
  <div class="card" id="cardRoot"></div>
</div>
</main>

<footer>
  <div class="footer-logo">French with Alban</div>
  <div class="footer-copy">© 2026 · frenchwithalban.com</div>
</footer>

<script>
const VERBS = [
  {inf:"être", en:"to be", aux:"avoir", pp:"été", forms:{je:"suis", tu:"es", il:"est", nous:"sommes", vous:"êtes", ils:"sont"}},
  {inf:"avoir", en:"to have", aux:"avoir", pp:"eu", forms:{je:"ai", tu:"as", il:"a", nous:"avons", vous:"avez", ils:"ont"}},
  {inf:"aller", en:"to go", aux:"etre", pp:"allé", forms:{je:"vais", tu:"vas", il:"va", nous:"allons", vous:"allez", ils:"vont"}},
  {inf:"faire", en:"to make / to do", aux:"avoir", pp:"fait", forms:{je:"fais", tu:"fais", il:"fait", nous:"faisons", vous:"faites", ils:"font"}},
  {inf:"vouloir", en:"to want", aux:"avoir", pp:"voulu", forms:{je:"veux", tu:"veux", elle:"veut", nous:"voulons", vous:"voulez", elles:"veulent"}},
  {inf:"pouvoir", en:"to be able to / can", aux:"avoir", pp:"pu", forms:{je:"peux", tu:"peux", elle:"peut", nous:"pouvons", vous:"pouvez", elles:"peuvent"}},
  {inf:"devoir", en:"to have to / must", aux:"avoir", pp:"dû", forms:{je:"dois", tu:"dois", elle:"doit", nous:"devons", vous:"devez", elles:"doivent"}},
  {inf:"savoir", en:"to know (things)", aux:"avoir", pp:"su", forms:{je:"sais", tu:"sais", elle:"sait", nous:"savons", vous:"savez", elles:"savent"}},
  {inf:"venir", en:"to come", aux:"etre", pp:"venu", forms:{je:"viens", tu:"viens", elle:"vient", nous:"venons", vous:"venez", elles:"viennent"}},
  {inf:"tenir", en:"to hold", aux:"avoir", pp:"tenu", forms:{je:"tiens", tu:"tiens", elle:"tient", nous:"tenons", vous:"tenez", elles:"tiennent"}},
  {inf:"lire", en:"to read", aux:"avoir", pp:"lu", forms:{je:"lis", tu:"lis", elle:"lit", nous:"lisons", vous:"lisez", elles:"lisent"}},
  {inf:"dire", en:"to say", aux:"avoir", pp:"dit", forms:{je:"dis", tu:"dis", il:"dit", nous:"disons", vous:"dites", elles:"disent"}},
  {inf:"recevoir", en:"to receive", aux:"avoir", pp:"reçu", forms:{je:"reçois", tu:"reçois", il:"reçoit", nous:"recevons", vous:"recevez", ils:"reçoivent"}},
  {inf:"voir", en:"to see", aux:"avoir", pp:"vu", forms:{je:"vois", tu:"vois", elle:"voit", nous:"voyons", vous:"voyez", elles:"voient"}},
  {inf:"croire", en:"to believe", aux:"avoir", pp:"cru", forms:{je:"crois", tu:"crois", elle:"croit", nous:"croyons", vous:"croyez", elles:"croient"}},
  {inf:"boire", en:"to drink", aux:"avoir", pp:"bu", forms:{je:"bois", tu:"bois", elle:"boit", nous:"buvons", vous:"buvez", elles:"boivent"}},
  {inf:"écrire", en:"to write", aux:"avoir", pp:"écrit", forms:{je:"écris", tu:"écris", elle:"écrit", nous:"écrivons", vous:"écrivez", elles:"écrivent"}},
  {inf:"dormir", en:"to sleep", aux:"avoir", pp:"dormi", forms:{je:"dors", tu:"dors", il:"dort", nous:"dormons", vous:"dormez", ils:"dorment"}},
  {inf:"partir", en:"to leave", aux:"etre", pp:"parti", forms:{je:"pars", tu:"pars", il:"part", nous:"partons", vous:"partez", ils:"partent"}},
  {inf:"sortir", en:"to go out", aux:"etre", pp:"sorti", forms:{je:"sors", tu:"sors", il:"sort", nous:"sortons", vous:"sortez", ils:"sortent"}},
  {inf:"mettre", en:"to put", aux:"avoir", pp:"mis", forms:{je:"mets", tu:"mets", elle:"met", nous:"mettons", vous:"mettez", elles:"mettent"}},
  {inf:"prendre", en:"to take", aux:"avoir", pp:"pris", forms:{je:"prends", tu:"prends", il:"prend", nous:"prenons", vous:"prenez", ils:"prennent"}},
  {inf:"ouvrir", en:"to open", aux:"avoir", pp:"ouvert", forms:{je:"ouvre", tu:"ouvres", il:"ouvre", nous:"ouvrons", vous:"ouvrez", ils:"ouvrent"}},
  {inf:"offrir", en:"to offer", aux:"avoir", pp:"offert", forms:{je:"offre", tu:"offres", elle:"offre", nous:"offrons", vous:"offrez", elles:"offrent"}},
  {inf:"appeler", en:"to call", aux:"avoir", pp:"appelé", forms:{je:"appelle", tu:"appelles", il:"appelle", nous:"appelons", vous:"appelez", ils:"appellent"}},
  {inf:"connaître", en:"to know (places, people)", aux:"avoir", pp:"connu", forms:{je:"connais", tu:"connais", elle:"connaît", nous:"connaissons", vous:"connaissez", elles:"connaissent"}},
  {inf:"conduire", en:"to drive", aux:"avoir", pp:"conduit", forms:{je:"conduis", tu:"conduis", elle:"conduit", nous:"conduisons", vous:"conduisez", elles:"conduisent"}},
  {inf:"produire", en:"to produce", aux:"avoir", pp:"produit", forms:{je:"produis", tu:"produis", il:"produit", nous:"produisons", vous:"produisez", ils:"produisent"}},
];

const AVOIR_PRESENT = {je:"ai",tu:"as",il:"a",elle:"a",nous:"avons",vous:"avez",ils:"ont",elles:"ont"};
const ETRE_PRESENT = {je:"suis",tu:"es",il:"est",elle:"est",nous:"sommes",vous:"êtes",ils:"sont",elles:"sont"};
const IMPARFAIT_ENDINGS = {je:"ais",tu:"ais",il:"ait",elle:"ait",nous:"ions",vous:"iez",ils:"aient",elles:"aient"};

function imparfaitStem(v){ return v.inf==="être" ? "ét" : v.forms.nous.replace(/ons$/,""); }
function buildImparfaitForms(v){ const stem=imparfaitStem(v),out={}; for(const p of Object.keys(v.forms)) out[p]=stem+IMPARFAIT_ENDINGS[p]; return out; }
function agreePP(pp,pronoun,aux){ if(aux!=="etre") return pp; if(pronoun==="elle") return pp+"e"; if(pronoun==="ils") return pp+"s"; if(pronoun==="elles") return pp+"es"; return pp; }
function buildPasseCompose(v){ const aux=v.aux==="etre"?ETRE_PRESENT:AVOIR_PRESENT,out={}; for(const p of Object.keys(v.forms)) out[p]=aux[p]+" "+agreePP(v.pp,p,v.aux); return out; }
for(const v of VERBS) v.tenses={present:v.forms, imparfait:buildImparfaitForms(v), passeCompose:buildPasseCompose(v)};

const TENSE_META = {
  present:{label:"Présent", eyebrow:"Conjugue au présent"},
  imparfait:{label:"Imparfait", eyebrow:"Conjugue à l'imparfait"},
  passeCompose:{label:"Passé composé", eyebrow:"Conjugue au passé composé"},
};

function pronounLabel(p,form){ if(p==="je") return /^[aeiouyhâàéèêëîïôùûüœ]/i.test(form)?"j'":"je"; return {je:"je",tu:"tu",il:"il",elle:"elle",nous:"nous",vous:"vous",ils:"ils",elles:"elles"}[p]; }
function stripAccents(s){ return s.normalize("NFD").replace(/[\u0300-\u036f]/g,""); }
function baseConj(s){ return s.trim().toLowerCase().replace(/^(je|j'|j|tu|il|elle|on|nous|vous|ils|elles)\s*['\s]+/,"").replace(/\s+/g," ").trim(); }
function normEn(s){ return stripAccents(s.trim().toLowerCase()).replace(/^to\s+/,"").replace(/[().,]/g,"").replace(/\s+/g," ").trim(); }
function levenshtein(a,b){ const m=a.length,n=b.length,d=Array.from({length:m+1},(_,i)=>[i,...Array(n).fill(0)]); for(let j=0;j<=n;j++) d[0][j]=j; for(let i=1;i<=m;i++) for(let j=1;j<=n;j++) d[i][j]=a[i-1]===b[j-1]?d[i-1][j-1]:1+Math.min(d[i-1][j-1],d[i-1][j],d[i][j-1]); return d[m][n]; }
function translationApprox(guess,correct){ if(!guess.trim()) return false; const g=normEn(guess),opts=normEn(correct).split("/").map(x=>x.trim()).filter(Boolean); for(const opt of opts){ if(g===opt||opt.includes(g)||g.includes(opt)) return true; if(levenshtein(g,opt)<=Math.max(1,Math.floor(opt.length*0.25))) return true; } return false; }

/* Statut de la conjugaison : exact (1 pt) / accent (0,5 pt) / wrong (0 pt) */
function conjStatus(given, answer){
  const g = baseConj(given), a = baseConj(answer);
  if(!g) return "wrong";
  if(g === a) return "exact";
  if(stripAccents(g) === stripAccents(a)) return "accent";
  return "wrong";
}
function pointsFor(status){ return status==="exact" ? 1 : (status==="accent" ? 0.5 : 0); }

const ACCENTS = ["é","è","ê","ë","à","â","î","ï","ô","ù","û","ç","œ"];

function buildPool(verbFilter,tenseFilter){ const pool=[]; for(const v of VERBS){ if(verbFilter&&!verbFilter.has(v.inf)) continue; for(const tense of Object.keys(v.tenses)){ if(tenseFilter&&!tenseFilter.has(tense)) continue; for(const p of Object.keys(v.tenses[tense])) pool.push({inf:v.inf,en:v.en,pronoun:p,answer:v.tenses[tense][p],tense}); } } return pool; }
function shuffle(arr){ const a=[...arr]; for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]; } return a; }
function insertAtCursor(input,char){ const s=input.selectionStart??input.value.length,e=input.selectionEnd??input.value.length; input.value=input.value.slice(0,s)+char+input.value.slice(e); input.focus(); input.setSelectionRange(s+char.length,s+char.length); }

let state = { screen:"home", selectedCount:10, selectedVerbs:new Set(VERBS.map(v=>v.inf)), selectedTenses:new Set(["present"]), questions:[], idx:0, results:[], totalScore:0, answered:false, rewriteDone:false };

/* Mentions basées sur le pourcentage de la note finale (plafonnée) */
function mention(pct){
  if(pct>=100) return {label:"parfait !", cls:"m-parfait"};
  if(pct>=90)  return {label:"très bien", cls:"m-tresbien"};
  if(pct>=80)  return {label:"bien", cls:"m-bien"};
  if(pct>=70)  return {label:"assez bien", cls:"m-assezbien"};
  return {label:"à revoir", cls:"m-revoir"};
}
function cappedScore(){ return Math.min(Math.round(state.totalScore*100)/100, state.questions.length); }

function startQuiz(n){ const pool=shuffle(buildPool(state.selectedVerbs,state.selectedTenses)); if(!pool.length) return; state.questions=pool.slice(0,Math.min(n,pool.length)); state.idx=0; state.results=[]; state.totalScore=0; state.answered=false; state.rewriteDone=false; state.screen="quiz"; render(); }
function currentQ(){ return state.questions[state.idx]; }

function submitAnswer(ci,ti){
  const q=currentQ(), given=ci.value;
  const status=conjStatus(given,q.answer);
  const trans=ti.value.trim().length>0;
  const correctTrans=trans?translationApprox(ti.value,q.en):false;
  let pts=pointsFor(status);
  if(correctTrans) pts+=0.1;              /* bonus indépendant de la conjugaison */
  state.totalScore+=pts;
  state.results.push({inf:q.inf,pronoun:q.pronoun,answer:q.answer,en:q.en,tense:q.tense,given:given.trim(),status,gaveTranslation:trans,correctTrans,points:Math.round(pts*100)/100});
  state.answered=true;
  state.rewriteDone=(status==="exact");   /* réécriture exigée si ce n'est pas exact */
  render();
}
function nextQ(){ state.answered=false; state.rewriteDone=false; if(state.idx+1>=state.questions.length){ finishQuiz(); }else{ state.idx++; render(); } }
function finishQuiz(){ state.screen="result"; render(); }
function goHome(){ state.screen="home"; render(); }

let showVerbPicker=false;

/* Mise à jour sans re-render : évite que la liste des verbes remonte en haut */
function updateVerbUI(){
  const sb=document.getElementById("startBtn");
  if(sb) sb.disabled = (state.selectedVerbs.size===0 || state.selectedTenses.size===0);
}

function render(){
  const root=document.getElementById("cardRoot");

  if(state.screen==="home"){
    root.innerHTML=`
      <div class="home">
        <h2>Verbes irréguliers</h2>
        <p class="lede">Conjugue le verbe demandé. Ajoute la traduction en anglais pour un bonus de +0,1 point. Une erreur d'accent vaut 0,5 point.</p>
        <div class="section-label">Nombre de questions</div>
        <div class="mode-choice">
          <button class="mode-btn ${state.selectedCount===10?'selected':''}" data-count="10"><span class="num">10</span><span class="lbl">questions</span></button>
          <button class="mode-btn ${state.selectedCount===20?'selected':''}" data-count="20"><span class="num">20</span><span class="lbl">questions</span></button>
        </div>
        <div class="tense-picker">
          <div class="section-label">Temps verbaux</div>
          <div class="tense-choice">${Object.keys(TENSE_META).map(t=>`<button class="tense-btn ${state.selectedTenses.has(t)?'selected':''}" data-tense="${t}">${TENSE_META[t].label}</button>`).join("")}</div>
        </div>
        <div class="verb-picker">
          <div class="verb-picker-head">
            <div class="section-label" style="margin:0">Verbes inclus</div>
            <button class="verb-picker-toggle" id="vpToggle">${showVerbPicker?'Fermer':'Choisir'}</button>
          </div>
          ${showVerbPicker?`<div class="verb-grid-wrap"><div class="verb-grid-actions"><button id="selAll">Tout cocher</button><button id="selNone">Tout décocher</button></div><div class="verb-grid">${VERBS.map(v=>`<label class="verb-chip"><input type="checkbox" data-verb="${v.inf}" ${state.selectedVerbs.has(v.inf)?'checked':''}><span>${v.inf}</span></label>`).join("")}</div></div>`
          :`<button class="verb-all-btn" id="vpSummary">${state.selectedVerbs.size===VERBS.length?`<b>Tous les verbes</b> (${VERBS.length})`:`<b>${state.selectedVerbs.size} verbe${state.selectedVerbs.size>1?'s':''}</b> sur ${VERBS.length}`}</button>`}
        </div>
        <button class="start-btn" id="startBtn" ${(state.selectedVerbs.size===0||state.selectedTenses.size===0)?'disabled':''}>Commencer le test</button>
      </div>`;

    root.querySelectorAll(".mode-btn").forEach(b=>b.addEventListener("click",()=>{state.selectedCount=parseInt(b.dataset.count);render();}));
    document.getElementById("startBtn").addEventListener("click",()=>startQuiz(state.selectedCount));
    root.querySelectorAll(".tense-btn").forEach(b=>b.addEventListener("click",()=>{const t=b.dataset.tense;if(state.selectedTenses.has(t)){if(state.selectedTenses.size>1)state.selectedTenses.delete(t);}else state.selectedTenses.add(t);render();}));
    document.getElementById("vpToggle").addEventListener("click",()=>{showVerbPicker=!showVerbPicker;render();});
    const vpSummary=document.getElementById("vpSummary");
    if(vpSummary) vpSummary.addEventListener("click",()=>{showVerbPicker=true;render();});
    const selAll=document.getElementById("selAll");
    if(selAll) selAll.addEventListener("click",()=>{ state.selectedVerbs=new Set(VERBS.map(v=>v.inf)); root.querySelectorAll(".verb-chip input").forEach(cb=>{cb.checked=true;}); updateVerbUI(); });
    const selNone=document.getElementById("selNone");
    if(selNone) selNone.addEventListener("click",()=>{ state.selectedVerbs=new Set(); root.querySelectorAll(".verb-chip input").forEach(cb=>{cb.checked=false;}); updateVerbUI(); });
    root.querySelectorAll(".verb-chip input").forEach(cb=>cb.addEventListener("change",()=>{ if(cb.checked)state.selectedVerbs.add(cb.dataset.verb); else state.selectedVerbs.delete(cb.dataset.verb); updateVerbUI(); }));
    return;
  }

  if(state.screen==="quiz"){
    const q=currentQ(),num=state.idx+1,total=state.questions.length,pct=Math.round((num-1)/total*100),pDisp=pronounLabel(q.pronoun,q.answer);
    const r=state.answered?state.results[state.results.length-1]:null;
    const needRewrite=state.answered && r.status!=="exact";
    root.innerHTML=`
      <div class="quiz-top"><span>Question ${num} / ${total}</span><span>Score : ${cappedScore()}</span></div>
      <div class="progress-track"><div class="progress-fill" style="width:${pct}%"></div></div>
      <div class="prompt-eyebrow">${TENSE_META[q.tense].eyebrow}</div>
      <div class="prompt-verb"><span class="pronoun">${pDisp}</span> ${q.inf}</div>
      <div class="field"><label for="ci">Forme conjuguée</label><input type="text" id="ci" autocomplete="off" ${state.answered?'disabled':''} placeholder="${pDisp}..."><div class="accent-row" id="accentRow">${ACCENTS.map(c=>`<button type="button" class="accent-btn" data-char="${c}" ${state.answered?'disabled':''}>${c}</button>`).join("")}</div></div>
      <div class="field"><label for="ti">Traduction <span class="opt">(optionnel, +0,1 pt)</span></label><input type="text" id="ti" autocomplete="off" ${state.answered?'disabled':''} placeholder="to ..."></div>
      <div id="fb"></div>
      ${needRewrite?`<div class="rewrite">
        <div class="rw-label">Réécris la forme correcte pour continuer</div>
        <div class="rw-hint">Accents compris — cette réécriture ne rapporte pas de point.</div>
        <input type="text" id="rw" autocomplete="off" placeholder="${q.answer}">
        <div class="accent-row" id="rwAccents">${ACCENTS.map(c=>`<button type="button" class="accent-btn" data-char="${c}">${c}</button>`).join("")}</div>
        <div class="rw-msg wait" id="rwMsg">En attente…</div>
      </div>`:``}
      <div class="actions">${state.answered?`<button class="btn btn-primary" id="nextBtn" ${needRewrite&&!state.rewriteDone?'disabled':''}>${num===total?'Voir le résultat':'Suivant'}</button>`:`<button class="btn btn-primary" id="submitBtn">Valider</button>`}</div>`;

    const ci=document.getElementById("ci"),ti=document.getElementById("ti");
    if(!state.answered){
      ci.focus();
      const submit=()=>submitAnswer(ci,ti);
      document.getElementById("submitBtn").addEventListener("click",submit);
      ci.addEventListener("keydown",e=>{if(e.key==="Enter")ti.focus();});
      ti.addEventListener("keydown",e=>{if(e.key==="Enter")submit();});
      root.querySelectorAll(".accent-btn").forEach(b=>b.addEventListener("click",()=>insertAtCursor(ci,b.dataset.char)));
    }else{
      ci.value=r.given;
      ci.className = r.status==="exact" ? "ok" : (r.status==="accent" ? "half" : "bad");
      if(r.gaveTranslation) ti.className=r.correctTrans?"ok":"bad";
      let msg;
      if(r.status==="exact") msg=`Correct — <b>${pDisp} ${r.answer}</b>. `;
      else if(r.status==="accent") msg=`Presque : attention aux accents. La forme exacte est <b>${pDisp} ${r.answer}</b> (0,5 pt). `;
      else msg=`La bonne forme est <b>${pDisp} ${r.answer}</b>. `;
      msg+=r.gaveTranslation?(r.correctTrans?`Traduction correcte (+0,1). `:`Traduction attendue : <b>${r.en}</b>.`):`Traduction : <b>${r.en}</b>.`;
      const fbCls = r.status==="exact" ? "ok" : (r.status==="accent" ? "half" : "bad");
      document.getElementById("fb").innerHTML=`<div class="feedback ${fbCls}">${msg}</div>`;

      const nextBtn=document.getElementById("nextBtn");
      nextBtn.addEventListener("click",()=>{ if(!nextBtn.disabled) nextQ(); });

      if(needRewrite){
        const rw=document.getElementById("rw"), rwMsg=document.getElementById("rwMsg");
        rw.focus();
        const check=()=>{
          if(state.rewriteDone) return;
          if(conjStatus(rw.value,q.answer)==="exact"){
            state.rewriteDone=true;
            rw.classList.add("done"); rw.disabled=true;
            rwMsg.className="rw-msg ok"; rwMsg.textContent="✓ C'est noté — tu peux continuer.";
            document.querySelectorAll("#rwAccents .accent-btn").forEach(b=>b.disabled=true);
            nextBtn.disabled=false;
          }else{
            rwMsg.className="rw-msg wait"; rwMsg.textContent="En attente…";
          }
        };
        rw.addEventListener("input",check);
        rw.addEventListener("keydown",e=>{ if(e.key==="Enter"){ check(); if(state.rewriteDone) nextQ(); } });
        document.querySelectorAll("#rwAccents .accent-btn").forEach(b=>b.addEventListener("click",()=>{ insertAtCursor(rw,b.dataset.char); check(); }));
      }
    }
    return;
  }

  if(state.screen==="result"){
    const total=state.questions.length, raw=Math.round(state.totalScore*100)/100, score=cappedScore(), pct=(score/total)*100, m=mention(pct);
    root.innerHTML=`
      <div class="result">
        <h2>Résultat</h2>
        <div class="score">${score} <span>/ ${total}</span></div>
        ${raw>score?`<div class="capped">Note brute : ${raw} — plafonnée à ${total}.</div>`:``}
        <span class="mention ${m.cls}">${m.label}</span>
        <div class="actions" style="margin-top:0;margin-bottom:20px;">
          <button class="btn btn-primary" id="retryBtn">Refaire un test</button>
          <button class="btn btn-ghost" id="homeBtn">Accueil</button>
        </div>
        <div class="breakdown">${state.results.map(r=>{
          const pDisp=pronounLabel(r.pronoun,r.answer);
          const tTag=r.tense!=='present'?` <span style="color:var(--text-soft);font-style:italic;">(${TENSE_META[r.tense].label.toLowerCase()})</span>`:'';
          const cls=r.status==="exact"?"yes":(r.status==="accent"?"half":"no");
          const mark=r.status==="exact"?'✓':(r.status==="accent"?'~ '+r.answer:'✗ '+r.answer);
          const bonus=r.correctTrans?' <span style="color:var(--gold)">+0,1</span>':'';
          return`<div class="breakdown-row"><span class="bv">${pDisp} ${r.inf} → ${r.given||'—'}${tTag}${bonus}</span><span class="status ${cls}">${mark}</span></div>`;
        }).join("")}</div>
      </div>`;
    document.getElementById("retryBtn").addEventListener("click",()=>startQuiz(state.selectedCount));
    document.getElementById("homeBtn").addEventListener("click",goHome);
    return;
  }
}
render();
</script>
</body>
</html>
