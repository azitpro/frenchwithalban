<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Créneaux disponibles — French with Alban</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=DM+Serif+Display&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --cream: #faf7f2;
  --cream-dark: #f0ece4;
  --navy: #0d2b45;
  --red: #c0392b;
  --gold: #c9972a;
  --border: #ddd8ce;
  --text-soft: #666;
  --green: #2e7d4f;
  --green-soft: #e8f4ed;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: var(--cream); font-family: 'Inter', sans-serif; color: var(--navy); padding: 0; margin: 0; }
.wrap { max-width: 640px; margin: 0 auto; padding: 0 20px 80px; }

header {
  padding: 28px 48px; border-bottom: 3px solid var(--navy);
  display: flex; justify-content: space-between; align-items: center;
  background: var(--cream); width: 100%; box-sizing: border-box;
}
h1 { font-family: 'DM Serif Display', serif; font-size: 1.8rem; color: var(--navy); margin: 40px 0 8px; }
.subtitle { font-size: 0.85rem; color: var(--text-soft); margin-bottom: 20px; }

.controls { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; flex-wrap: wrap; gap: 12px; }
.duration-toggle { display: flex; gap: 8px; }
.dur-btn {
  padding: 9px 18px; border: 1.5px solid var(--navy); background: transparent;
  color: var(--navy); font-family: 'Inter', sans-serif; font-size: 0.85rem;
  font-weight: 500; cursor: pointer; transition: all 0.15s;
}
.dur-btn.active { background: var(--navy); color: var(--cream); }

.week-nav { display: flex; align-items: center; gap: 12px; }
.week-arrow {
  width: 34px; height: 34px; border: 1.5px solid var(--navy); background: var(--cream);
  color: var(--navy); font-size: 1rem; cursor: pointer; display: flex; align-items: center; justify-content: center;
}
.week-arrow:disabled { opacity: 0.3; cursor: not-allowed; }
.week-label { font-family: 'Fraunces', serif; font-weight: 600; font-size: 0.95rem; min-width: 140px; text-align: center; }

.day-block { margin-bottom: 18px; }
.day-title {
  font-family: 'Fraunces', serif; font-size: 1.05rem; font-weight: 600;
  color: var(--navy); margin-bottom: 8px; padding-bottom: 6px; border-bottom: 1px solid var(--border);
}
.slot-list { display: flex; flex-wrap: wrap; gap: 8px; }
.slot {
  padding: 8px 14px; background: var(--green-soft); border: 1.5px solid var(--green);
  color: var(--green); font-weight: 600; font-size: 0.85rem;
}
.loading { color: var(--text-soft); font-style: italic; }
.no-slots { color: var(--text-soft); font-size: 0.85rem; font-style: italic; }

footer {
  background: var(--navy); padding: 28px 48px; border-top: 4px solid var(--gold);
  display: flex; justify-content: space-between; align-items: center;
}
.footer-nav { display: flex; gap: 20px; }
.footer-btn {
  font-size: 0.8rem; font-weight: 500; color: var(--cream);
  text-decoration: none; opacity: 0.65; border-bottom: 1px solid rgba(250,247,242,0.3); padding-bottom: 2px;
}
.footer-logo { font-family: 'Fraunces', serif; font-size: 1rem; color: var(--cream); }
.footer-copy { font-size: 0.72rem; color: rgba(250,247,242,0.4); }
</style>
</head>
<body>

<header>
  <div style="display: flex; align-items: center; gap: 10px;">
    <svg width="30" height="35" viewBox="0 0 24 28">
      <defs><clipPath id="hHeader"><polygon points="12,1 23,7 23,21 12,27 1,21 1,7"/></clipPath></defs>
      <rect x="0" y="0" width="8" height="28" fill="#002395" clip-path="url(#hHeader)"/>
      <rect x="8" y="0" width="8" height="28" fill="#fff" clip-path="url(#hHeader)"/>
      <rect x="16" y="0" width="8" height="28" fill="#ED2939" clip-path="url(#hHeader)"/>
      <polygon points="12,1 23,7 23,21 12,27 1,21 1,7" fill="none" stroke="#0d2b45" stroke-width="1.5"/>
    </svg>
    <span style="font-family:'Fraunces',serif; font-size:1.7rem; font-weight:700; color:var(--navy); letter-spacing:-0.01em;">French with <span style="color:var(--red)">Alban</span></span>
  </div>
  <nav style="display: flex; gap: 44px; align-items: center;">
    <a href="/" style="font-size:1.05rem; font-weight:500; letter-spacing:0.03em; color:var(--navy); text-decoration:none; opacity:0.65;">Accueil</a>
  </nav>
</header>

<div class="wrap">
<h1>Créneaux disponibles</h1>
<div class="subtitle">Sélectionnez la durée du cours et naviguez entre les semaines.</div>

<div class="controls">
  <div class="duration-toggle">
    <button class="dur-btn" data-dur="25" id="btn25">25 min</button>
    <button class="dur-btn active" data-dur="50" id="btn50">50 min</button>
  </div>
  <div class="week-nav">
    <button class="week-arrow" id="prevWeek">←</button>
    <span class="week-label" id="weekLabel">Semaine 1</span>
    <button class="week-arrow" id="nextWeek">→</button>
  </div>
</div>

<div id="scheduleRoot"><p class="loading">Chargement...</p></div>
</div>

<footer>
  <div class="footer-nav"><a href="/" class="footer-btn">Accueil</a></div>
  <div class="footer-logo">French with Alban</div>
  <div class="footer-copy">© 2026 · frenchwithalban.com</div>
</footer>

<script>
const WEEKDAYS = ['Dimanche', 'Lundi', 'Mardi', 'Mercredi', 'Jeudi', 'Vendredi', 'Samedi'];
const GRID_STEP = 0.5; // toujours sur heures rondes ou demies

let scheduleData = null;
let currentWeek = 0; // 0 to 3
let currentDuration = 50;;

function formatHour(h) {
  const hours = Math.floor(h);
  const minutes = Math.round((h - hours) * 60);
  return `${hours}h${minutes > 0 ? minutes.toString().padStart(2,'0') : ''}`;
}

function toDateStr(d) {
  return d.toISOString().split('T')[0];
}

function getWeekDays(weekIndex) {
  const today = new Date();
  today.setHours(0,0,0,0);
  const days = [];
  for (let i = 0; i < 7; i++) {
    const d = new Date(today);
    d.setDate(d.getDate() + weekIndex * 7 + i);
    days.push(d);
  }
  return days;
}

function render() {
  const root = document.getElementById('scheduleRoot');
  const days = getWeekDays(currentWeek);

  const weekStart = days[0];
const weekEnd = days[days.length - 1];
const sameMonth = weekStart.getMonth() === weekEnd.getMonth();
const months = ['janv.','févr.','mars','avr.','mai','juin','juil.','août','sept.','oct.','nov.','déc.'];
const label = sameMonth
  ? `${weekStart.getDate()} - ${weekEnd.getDate()} ${months[weekEnd.getMonth()]}`
  : `${weekStart.getDate()} ${months[weekStart.getMonth()]} - ${weekEnd.getDate()} ${months[weekEnd.getMonth()]}`;
document.getElementById('weekLabel').textContent = label;
  document.getElementById('prevWeek').disabled = currentWeek === 0;
  document.getElementById('nextWeek').disabled = currentWeek === 3;

  let html = '';

  days.forEach(date => {
    const dateStr = toDateStr(date);
    const weekdayName = WEEKDAYS[date.getDay()];

    // Availability windows for this weekday
    const windows = scheduleData.availability.filter(a => a.weekday === weekdayName);
    if (windows.length === 0) return; // no availability defined for this day at all

    // Occupied intervals for this date
    const occupied = [];
    // Check full-day unavailability first
    const fullDayBlocked = (scheduleData.unavailability || []).some(u => u.type === 'day' && u.date === dateStr);
    if (fullDayBlocked) return;
    scheduleData.recurring.forEach(r => {
      if (!r.active) return;
      if (r.weekday !== weekdayName) return;
      const isException = scheduleData.exceptions.some(e => e.recurringId === r.id && e.date === dateStr);
      if (isException) return;
      occupied.push([r.hour, r.hour + r.duration/60]);
    });
    scheduleData.oneOff.forEach(o => {
      if (o.date !== dateStr) return;
      occupied.push([o.hour, o.hour + o.duration/60]);
    });
    preplyBusy.forEach(b => {
  if (b.date !== dateStr) return;
  occupied.push([b.startHour, b.endHour]);
});
(scheduleData.unavailability || []).forEach(u => {
      if (u.type !== 'range' || u.date !== dateStr) return;
      occupied.push([u.start, u.end]);
    });
    occupied.sort((a,b) => a[0]-b[0]);

    // Compute free intervals within each availability window
    const slots = [];
    windows.forEach(win => {
      let cursor = win.start;
      const relevant = occupied.filter(([s,e]) => e > win.start && s < win.end);
      const freeIntervals = [];
      relevant.forEach(([s,e]) => {
        if (s > cursor) freeIntervals.push([cursor, Math.min(s, win.end)]);
        cursor = Math.max(cursor, e);
      });
      if (cursor < win.end) freeIntervals.push([cursor, win.end]);

      freeIntervals.forEach(([start, end]) => {
        // Snap start up to next grid step
        let t = Math.ceil(start / GRID_STEP) * GRID_STEP;
        while (t + currentDuration/60 <= end + 0.001) {
          slots.push(t);
          t += GRID_STEP;
        }
      });
    });

    if (slots.length > 0) {
      html += `
        <div class="day-block">
          <div class="day-title">${weekdayName} ${date.getDate()}/${date.getMonth()+1}</div>
          <div class="slot-list">${slots.map(h => `<div class="slot">${formatHour(h)}</div>`).join('')}</div>
        </div>`;
    }
  });

  root.innerHTML = html || '<p class="no-slots">Aucun créneau disponible cette semaine.</p>';
}

let preplyBusy = [];

async function loadSchedule() {
  const root = document.getElementById('scheduleRoot');
  try {
    const [res, preplyRes] = await Promise.all([
      fetch('/api/schedule'),
      fetch('/api/preply-busy').catch(() => null),
    ]);
    const data = await res.json();
    scheduleData = {
      recurring: data.recurring || [],
      exceptions: data.exceptions || [],
      oneOff: data.oneOff || [],
      availability: data.availability || [],
      unavailability: data.unavailability || [],
    };

    if (preplyRes && preplyRes.ok) {
      preplyBusy = await preplyRes.json();
      if (!Array.isArray(preplyBusy)) preplyBusy = [];
    }

    render();
  } catch (e) {
    root.innerHTML = '<p class="loading">Erreur de chargement. Réessayez plus tard.</p>';
  }
}

document.getElementById('btn25').addEventListener('click', () => {
  currentDuration = 25;
  document.getElementById('btn25').classList.add('active');
  document.getElementById('btn50').classList.remove('active');
  render();
});
document.getElementById('btn50').addEventListener('click', () => {
  currentDuration = 50;
  document.getElementById('btn50').classList.add('active');
  document.getElementById('btn25').classList.remove('active');
  render();
});
document.getElementById('prevWeek').addEventListener('click', () => {
  if (currentWeek > 0) { currentWeek--; render(); }
});
document.getElementById('nextWeek').addEventListener('click', () => {
  if (currentWeek < 3) { currentWeek++; render(); }
});

loadSchedule();
</script>
</body>
</html>
