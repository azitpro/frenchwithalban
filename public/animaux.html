<html lang="fr">
<head>
<meta charset="UTF-8">

<title>Les animaux — French with Alban</title>

<style>
  :root{
    --navy:#0d2b45; --rouge:#c0392b; --or:#c9972a; --creme:#faf7f2;
    --gris-texte:#4a5568; --bordure:#e6e0d6; --rose-fem:#c2185b;
    --vert:#2f7d51; --vert-doux:#e8f4ec;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:'Inter',sans-serif;color:var(--navy);background:#fff;line-height:1.7;-webkit-font-smoothing:antialiased;}

  header{width:100%;background:#fff;border-bottom:3px solid var(--navy);padding:28px 48px;
    display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100;}
  .logo{display:flex;align-items:center;gap:12px;font-family:'Fraunces',serif;font-size:1.7rem;font-weight:600;white-space:nowrap;text-decoration:none;}
  .logo .fw{color:var(--navy);} .logo .al{color:var(--rouge);}
  nav{display:flex;gap:44px;}
  nav a{font-size:1.05rem;font-weight:500;color:var(--navy);text-decoration:none;transition:color .2s;}
  nav a:hover{color:var(--rouge);}
  .gold-line{height:2px;background:var(--or);width:100%;}

  .wrap{max-width:900px;margin:0 auto;padding:0 24px;}
  .hero{background:var(--creme);width:100%;padding:56px 24px 48px;text-align:center;border-bottom:1px solid var(--bordure);}
  .hero h1{font-family:'DM Serif Display',serif;font-size:3rem;font-weight:400;line-height:1.15;}

  /* onglets */
  .onglets{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin:32px 0 8px;}
  .onglet{font-family:'Inter',sans-serif;font-size:.95rem;font-weight:600;padding:11px 22px;
    border:1.5px solid var(--navy);background:#fff;color:var(--navy);cursor:pointer;transition:all .15s;}
  .onglet.on{background:var(--navy);color:#fff;box-shadow:3px 3px 0 var(--rouge);}
  .onglet:focus-visible{outline:2px solid var(--or);outline-offset:2px;}

  section{padding:32px 0 56px;}
  h2{font-family:'Fraunces',serif;font-size:1.5rem;font-weight:600;display:flex;align-items:center;gap:13px;margin:28px 0 14px;}
  .hex{flex-shrink:0;width:22px;height:26px;}
  .intro{color:var(--gris-texte);margin-bottom:16px;}

  .mots{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin-bottom:8px;}
  .mot{background:var(--creme);border:1px solid var(--bordure);border-top:2px solid var(--navy);
    padding:12px 10px;text-align:center;font-family:'Fraunces',serif;font-size:1rem;font-weight:600;}
  .mot small{display:block;font-family:'Inter',sans-serif;font-size:.78rem;font-weight:400;color:var(--rouge);margin-top:2px;}

  .carte{background:var(--creme);border:2px solid var(--navy);box-shadow:6px 6px 0 var(--navy);
    padding:30px 26px;margin:20px 0;text-align:center;}
  .compteur{font-size:.8rem;letter-spacing:.1em;text-transform:uppercase;color:var(--gris-texte);margin-bottom:16px;}
  .piste{height:3px;background:var(--bordure);margin-bottom:22px;overflow:hidden;}
  .piste span{display:block;height:100%;background:var(--rouge);transition:width .25s;}
  .question{font-size:1.3rem;font-weight:500;line-height:1.4;margin-bottom:6px;}
  .question b{font-family:'Fraunces',serif;color:var(--rouge);}
  .opts{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-top:20px;}
  .opts button{font-family:'Inter',sans-serif;font-size:.95rem;padding:10px 20px;border:1px solid var(--bordure);
    border-radius:999px;background:#fff;color:var(--navy);cursor:pointer;transition:all .15s;}
  .opts button:hover:not(:disabled){border-color:var(--navy);}
  .opts button.juste{background:var(--vert-doux);border-color:var(--vert);color:var(--vert);font-weight:600;}
  .opts button.faux{background:#fdeceb;border-color:var(--rouge);color:var(--rouge);}
  .opts button:disabled{cursor:default;}
  .explication{margin-top:16px;font-size:.92rem;color:var(--gris-texte);min-height:1.4em;}
  .en{font-size:1.5rem;font-weight:500;line-height:1.4;color:var(--navy);}
  .fr{font-family:'Fraunces',serif;font-size:1.6rem;font-weight:600;color:var(--rouge);
      margin-top:18px;padding-top:18px;border-top:1px dashed var(--bordure);}
  .btn.oui{background:var(--vert);} .btn.oui:hover{background:#256641;}
  .btn.non{background:var(--rouge);} .btn.non:hover{background:#9c2f22;}

  .actions{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:20px;}
  .btn{font-family:'Inter',sans-serif;font-size:.95rem;font-weight:600;padding:12px 26px;border:none;
    border-radius:8px;background:var(--navy);color:#fff;cursor:pointer;transition:background .2s;}
  .btn:hover{background:#164066;}
  .btn.secondaire{background:#fff;color:var(--navy);border:1px solid var(--navy);}
  .btn:focus-visible{outline:2px solid var(--or);outline-offset:2px;}
  .score{font-family:'DM Serif Display',serif;font-size:3rem;color:var(--navy);line-height:1.1;}
  .score small{font-size:1.2rem;color:var(--gris-texte);}

  footer{width:100%;background:var(--navy);color:#fff;padding:36px 48px;text-align:center;font-size:.92rem;border-top:4px solid var(--or);}
  footer a{color:#fff;text-decoration:underline;}

  @media (max-width:720px){
    header{padding:18px 20px;flex-wrap:wrap;gap:12px;}
    .logo{font-size:1.3rem;} nav{gap:24px;}
    .hero h1{font-size:2.1rem;}
    .mots{grid-template-columns:repeat(2,1fr);}
    .carte{padding:22px 16px;box-shadow:4px 4px 0 var(--navy);}
    .question{font-size:1.1rem;}
    footer{padding:28px 20px;}
  }
</style>
</head>

/* ================= OUTILS ================= */
function melange(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;}return a;}
function el(h){var d=document.createElement('div');d.innerHTML=h;return d;}
var contenu=document.getElementById('contenu');

/* ================= ONGLETS ================= */
var ONGLETS=[["liste","Le vocabulaire"],["cartes","Cartes de révision"],["cat","Trouve la catégorie"],["petits","Les petits"],["pieges","Les pièges"]];
var boite=document.getElementById('onglets');
ONGLETS.forEach(function(o){
  var b=document.createElement('button');
  b.className='onglet'; b.textContent=o[1]; b.dataset.vue=o[0];
  b.addEventListener('click',function(){
    document.querySelectorAll('.onglet').forEach(function(x){x.classList.remove('on');});
    b.classList.add('on'); afficher(o[0]);
  });
  boite.appendChild(b);
});

function afficher(vue){
  contenu.innerHTML='';
  if(vue==='liste') vueListe();
  if(vue==='cartes') exoCartes();
  if(vue==='cat') exoCategorie();
  if(vue==='petits') exoPetits();
  if(vue==='pieges') exoPieges();
}

/* ================= VUE LISTE ================= */
function vueListe(){
  Object.keys(CATS).forEach(function(k){
    var c=CATS[k];
    var h='<h2><svg class="hex"><use href="#hex-tri"/></svg>'+c.titre+'</h2><div class="mots">';
    c.mots.forEach(function(m){ h+='<div class="mot">'+m[0]+'<small>'+m[1]+'</small></div>'; });
    h+='</div>';
    contenu.appendChild(el(h));
  });
  var h='<h2><svg class="hex"><use href="#hex-tri"/></svg>Les noms des petits</h2><div class="mots">';
  PETITS.forEach(function(p){ h+='<div class="mot">'+p[1]+'<small>'+p[0]+'</small></div>'; });
  h+='</div>';
  contenu.appendChild(el(h));
}

/* ================= MOTEUR D'EXERCICE ================= */
function lancer(items, rendu){
  var paquet=melange(items), i=0, bons=0, erreurs=[];
  function etape(){
    if(i>=paquet.length) return bilan();
    contenu.innerHTML='';
    var q=rendu(paquet[i]);
    var pct=Math.round(i/paquet.length*100);
    var carte=el('<div class="carte">'+
      '<div class="compteur">Question '+(i+1)+' sur '+paquet.length+'</div>'+
      '<div class="piste"><span style="width:'+pct+'%"></span></div>'+
      '<div class="question">'+q.texte+'</div>'+
      '<div class="opts"></div><div class="explication"></div></div>').firstChild;
    var opts=carte.querySelector('.opts'), expl=carte.querySelector('.explication');
    melange(q.options).forEach(function(o){
      var b=document.createElement('button'); b.type='button'; b.textContent=o;
      b.addEventListener('click',function(){
        opts.querySelectorAll('button').forEach(function(x){x.disabled=true;});
        if(o===q.bonne){ b.classList.add('juste'); bons++; }
        else { b.classList.add('faux'); erreurs.push(paquet[i]);
          opts.querySelectorAll('button').forEach(function(x){ if(x.textContent===q.bonne) x.classList.add('juste'); }); }
        expl.textContent=q.explication||'';
        var suite=document.createElement('div'); suite.className='actions';
        var n=document.createElement('button'); n.className='btn';
        n.textContent=(i+1===paquet.length)?'Voir le résultat':'Suivant';
        n.addEventListener('click',function(){ i++; etape(); });
        suite.appendChild(n); carte.appendChild(suite); n.focus();
      });
      opts.appendChild(b);
    });
    contenu.appendChild(carte);
  }
  function bilan(){
    contenu.innerHTML='';
    var c=el('<div class="carte">'+
      '<div class="score">'+bons+' <small>/ '+paquet.length+'</small></div>'+
      '<div class="explication">'+(erreurs.length?erreurs.length+' à revoir.':'Tout est acquis.')+'</div>'+
      '<div class="actions"></div></div>').firstChild;
    var a=c.querySelector('.actions');
    if(erreurs.length){
      var r=document.createElement('button'); r.className='btn'; r.textContent='Réviser les erreurs';
      var copie=erreurs.slice();
      r.addEventListener('click',function(){ lancer(copie,rendu); });
      a.appendChild(r);
    }
    var re=document.createElement('button'); re.className='btn secondaire'; re.textContent='Recommencer';
    re.addEventListener('click',function(){ lancer(items,rendu); });
    a.appendChild(re);
    contenu.appendChild(c);
  }
  etape();
}

/* ================= EXERCICE : CATÉGORIE ================= */
var LIBELLES={domestiques:"Domestique",foret:"Forêt",sauvages:"Sauvage",insectes:"Insecte",marins:"Marin"};
function exoCategorie(){
  var items=[];
  Object.keys(CATS).forEach(function(k){
    CATS[k].mots.forEach(function(m){ items.push({mot:m[0],cat:k}); });
  });
  items=melange(items).slice(0,20);
  lancer(items,function(it){
    return {
      texte:'À quelle catégorie appartient <b>'+it.mot+'</b> ?',
      options:Object.keys(LIBELLES).map(function(k){return LIBELLES[k];}),
      bonne:LIBELLES[it.cat],
      explication:''
    };
  });
}

/* ================= EXERCICE : LES PETITS ================= */
function exoPetits(){
  lancer(PETITS.slice(),function(p){
    var faux=melange(PETITS.filter(function(x){return x[1]!==p[1];})).slice(0,2).map(function(x){return x[1];});
    return {
      texte:'Comment s\'appelle le petit de <b>'+p[0]+'</b> ?',
      options:[p[1]].concat(faux),
      bonne:p[1],
      explication:'Le petit de '+p[0]+' est '+p[1]+'.'
    };
  });
}

/* ================= EXERCICE : CARTES DE RÉVISION ================= */
function exoCartes(){
  var tous=[];
  Object.keys(CATS).forEach(function(k){
    CATS[k].mots.forEach(function(m){ if(EN[m[0]]) tous.push({fr:m[0], en:EN[m[0]]}); });
  });
  accueilCartes(tous);
}

function accueilCartes(liste){
  contenu.innerHTML='';
  var c=el('<div class="carte"><div class="en">'+liste.length+' animaux à réviser</div>'+
           '<div class="explication">Une traduction anglaise apparaît. Dites l\'animal en français, puis vérifiez.</div>'+
           '<div class="actions"></div></div>').firstChild;
  var b=document.createElement('button'); b.className='btn'; b.textContent='Commencer';
  b.addEventListener('click',function(){ jouerCartes(melange(liste), liste); });
  c.querySelector('.actions').appendChild(b);
  contenu.appendChild(c);
}

function jouerCartes(paquet, source){
  var i=0, revelee=false, bons=0, erreurs=[];

  function etape(){
    if(i>=paquet.length) return bilanCartes();
    contenu.innerHTML='';
    var carte=paquet[i];
    var pct=Math.round(i/paquet.length*100);
    var c=el('<div class="carte">'+
      '<div class="compteur">Carte '+(i+1)+' sur '+paquet.length+'</div>'+
      '<div class="piste"><span style="width:'+pct+'%"></span></div>'+
      '<div class="en">'+carte.en+'</div>'+
      (revelee?'<div class="fr">'+carte.fr+'</div>':'')+
      '<div class="actions"></div></div>').firstChild;
    var a=c.querySelector('.actions');

    if(revelee){
      var oui=document.createElement('button'); oui.className='btn oui'; oui.innerHTML='\u2713&nbsp; Je savais';
      oui.addEventListener('click',function(){ bons++; i++; revelee=false; etape(); });
      var non=document.createElement('button'); non.className='btn non'; non.innerHTML='\u2717&nbsp; Je ne savais pas';
      non.addEventListener('click',function(){ erreurs.push(carte); i++; revelee=false; etape(); });
      a.appendChild(oui); a.appendChild(non);
    } else {
      var v=document.createElement('button'); v.className='btn'; v.textContent='Afficher la réponse';
      v.addEventListener('click',function(){ revelee=true; etape(); });
      a.appendChild(v);
    }

    contenu.appendChild(c);
    var stop=el('<div class="actions"></div>').firstChild;
    var s=document.createElement('button'); s.className='btn secondaire'; s.textContent='Arrêter';
    s.addEventListener('click',function(){ accueilCartes(source); });
    stop.appendChild(s); contenu.appendChild(stop);
  }

  function bilanCartes(){
    contenu.innerHTML='';
    var c=el('<div class="carte">'+
      '<div class="score">'+bons+' <small>/ '+paquet.length+'</small></div>'+
      '<div class="explication">'+(erreurs.length?erreurs.length+' animal(aux) à revoir.':'Tout est acquis.')+'</div>'+
      '<div class="actions"></div></div>').firstChild;
    var a=c.querySelector('.actions');
    if(erreurs.length){
      var copie=erreurs.slice();
      var r=document.createElement('button'); r.className='btn'; r.textContent='Réviser les erreurs';
      r.addEventListener('click',function(){ jouerCartes(melange(copie), source); });
      a.appendChild(r);
    }
    var re=document.createElement('button'); re.className='btn secondaire'; re.textContent='Recommencer';
    re.addEventListener('click',function(){ jouerCartes(melange(source), source); });
    a.appendChild(re);
    var st=document.createElement('button'); st.className='btn secondaire'; st.textContent='Arrêter';
    st.addEventListener('click',function(){ accueilCartes(source); });
    a.appendChild(st);
    contenu.appendChild(c);
  }

  etape();
}
