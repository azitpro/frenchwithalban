<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Salutations et politesse — French with Alban</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=DM+Serif+Display&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --cream: #faf7f2;
  --cream-dark: #f0ece4;
  --navy: #0d2b45;
  --red: #c0392b;
  --gold: #c9972a;
  --border: #ddd8ce;
  --text-soft: #666;
  --green: #2e7d4f;
  --green-soft: #e8f4ed;
  --red-soft: #fbeae8;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: var(--cream); font-family: 'Inter', sans-serif; color: var(--navy); padding: 40px 20px 80px; }
.wrap { max-width: 640px; margin: 0 auto; }

h1 { font-family: 'DM Serif Display', serif; font-size: 1.8rem; color: var(--navy); margin-bottom: 24px; }
.sub { font-size: 0.85rem; color: var(--text-soft); margin-bottom: 24px; }

.toggle-row { display: flex; gap: 8px; margin-bottom: 20px; }
.toggle-btn {
  padding: 9px 20px; border: 1.5px solid var(--navy); background: transparent;
  color: var(--navy); font-family: 'Inter', sans-serif; font-size: 0.82rem;
  font-weight: 500; cursor: pointer; transition: all 0.15s;
}
.toggle-btn.active { background: var(--navy); color: var(--cream); box-shadow: 3px 3px 0 var(--gold); }
.toggle-btn:hover:not(.active) { background: var(--cream-dark); }

table { width: 100%; border-collapse: collapse; margin-bottom: 56px; }
tr { border-bottom: 1px solid var(--border); }
tr:nth-child(even) { background: var(--cream-dark); }
td { padding: 12px 16px; font-size: 0.95rem; vertical-align: top; }
.fr { font-weight: 700; color: var(--navy); width: 34%; transition: opacity 0.2s; }
.pho { font-style: italic; font-weight: 300; color: var(--red); font-size: 0.8rem; width: 30%; transition: opacity 0.2s; }
.en { font-style: italic; font-weight: 300; color: var(--text-soft); width: 36%; transition: opacity 0.2s; }
.hidden-col { opacity: 0; width: 0; padding: 12px 0; overflow: hidden; white-space: nowrap; }

/* EXERCISES */
.ex-block { margin-bottom: 56px; padding-top: 32px; border-top: 2px solid var(--border); }
.ex-title { font-family: 'Fraunces', serif; font-size: 1.15rem; font-weight: 600; color: var(--navy); margin-bottom: 4px; }
.ex-title .num { color: var(--red); }
.ex-desc { font-size: 0.82rem; color: var(--text-soft); margin-bottom: 20px; }

.ex-card {
  background: var(--cream-dark); border: 1px solid var(--border);
  border-top: 3px solid var(--navy); padding: 28px;
}
.ex-progress { font-size: 0.78rem; color: var(--text-soft); margin-bottom: 12px; display: flex; justify-content: space-between; }
.ex-prompt {
  font-family: 'DM Serif Display', serif; font-size: 1.6rem; color: var(--navy);
  margin-bottom: 20px; text-align: center;
}

/* Exercise 1 - QCM */
.qcm-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.qcm-opt {
  padding: 14px; border: 1.5px solid var(--border); background: var(--cream);
  font-size: 0.95rem; font-weight: 500; color: var(--navy); cursor: pointer;
  text-align: center; transition: all 0.15s;
}
.qcm-opt:hover { border-color: var(--navy); }
.qcm-opt.correct { background: var(--green-soft); border-color: var(--green); color: var(--green); }
.qcm-opt.wrong { background: var(--red-soft); border-color: var(--red); color: var(--red); }
.qcm-opt.disabled { pointer-events: none; }

/* Exercise 2 - Scramble */
.scramble-answer {
  min-height: 48px; border-bottom: 2px solid var(--navy); margin-bottom: 24px;
  display: flex; gap: 6px; align-items: center; flex-wrap: wrap; padding-bottom: 8px;
}
.scramble-slot {
  width: 32px; height: 32px; display: flex; align-items: center; justify-content: center;
  font-weight: 700; font-size: 1.1rem; color: var(--navy); border-bottom: 2px solid var(--border);
}
.scramble-letters { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; margin-bottom: 20px; }
.scramble-letter {
  width: 40px; height: 40px; display: flex; align-items: center; justify-content: center;
  background: var(--navy); color: var(--cream); font-weight: 700; font-size: 1.05rem;
  cursor: pointer; transition: all 0.15s; box-shadow: 2px 2px 0 var(--gold);
}
.scramble-letter:hover { transform: translate(-1px,-1px); box-shadow: 3px 3px 0 var(--gold); }
.scramble-letter.used { opacity: 0.15; pointer-events: none; box-shadow: none; }

/* Exercise 3 - typing */
.type-field { display: flex; flex-direction: column; gap: 10px; margin-bottom: 16px; }
.type-field input {
  width: 100%; padding: 12px 14px; border: 1.5px solid var(--border);
  background: var(--cream); font-family: 'Inter', sans-serif; font-size: 1rem;
  color: var(--navy); outline: none;
}
.type-field input:focus { border-color: var(--navy); }
.type-field input.ok { border-color: var(--green); background: var(--green-soft); }
.type-field input.bad { border-color: var(--red); background: var(--red-soft); }
.type-field input.partial { border-color: var(--gold); background: #fdf3e3; }
.accent-row { display: flex; flex-wrap: wrap; gap: 5px; }
.accent-btn {
  width: 30px; height: 30px; border: 1.5px solid var(--border); background: var(--cream);
  font-size: 0.9rem; color: var(--navy); cursor: pointer; transition: all 0.15s;
}
.accent-btn:hover { border-color: var(--navy); background: var(--cream-dark); }

.ex-actions { display: flex; gap: 10px; margin-top: 20px; }
.btn { flex: 1; padding: 13px; font-family: 'Inter', sans-serif; font-weight: 600; font-size: 0.9rem; cursor: pointer; border: 1.5px solid var(--navy); transition: all 0.15s; }
.btn-primary { background: var(--navy); color: var(--cream); box-shadow: 3px 3px 0 var(--red); }
.btn-primary:hover { transform: translate(-1px,-1px); box-shadow: 4px 4px 0 var(--red); }
.btn-ghost { background: transparent; color: var(--text-soft); border-color: var(--border); }
.btn-ghost:hover { border-color: var(--navy); color: var(--navy); }
.btn:disabled { opacity: 0.35; cursor: not-allowed; }

.feedback { margin-top: 14px; padding: 12px 14px; font-size: 0.85rem; border-left: 3px solid; }
.feedback.ok { background: var(--green-soft); color: #1e5c35; border-color: var(--green); }
.feedback.bad { background: var(--red-soft); color: #8b2a20; border-color: var(--red); }

.ex-result { text-align: center; }
.ex-result .score { font-family: 'DM Serif Display', serif; font-size: 3rem; color: var(--navy); margin: 8px 0; }
.mention { display: inline-block; font-size: 0.72rem; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; padding: 5px 12px; margin-bottom: 20px; border: 1.5px solid; }
.m-revoir { background: var(--red-soft); color: var(--red); border-color: var(--red); }
.m-passable { background: #fdf3e3; color: #9a6c1a; border-color: #c9972a; }
.m-assezbien { background: #f0f5e8; color: #5a6e28; border-color: #8a9e3a; }
.m-bien { background: var(--green-soft); color: var(--green); border-color: var(--green); }
.m-tresbien { background: var(--navy); color: var(--cream); border-color: var(--navy); }

.dir-toggle { display: flex; gap: 8px; margin-bottom: 20px; justify-content: center; }
.dir-btn {
  padding: 8px 16px; border: 1.5px solid var(--border); background: var(--cream);
  font-size: 0.8rem; font-weight: 500; color: var(--text-soft); cursor: pointer;
}
.dir-btn.active { background: var(--navy); color: var(--cream); border-color: var(--navy); }
.ex-icon { display: flex; gap: 5px; margin-bottom: 10px; align-items: flex-end; }
.ex-icon .qcm-i { width: 26px; height: 9px; background: var(--navy); }
.ex-icon.qcm-grid-i { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; width: 56px; }
.ex-icon .scr-i { width: 14px; height: 14px; background: var(--navy); }
.ex-icon .typ-i { display: flex; flex-direction: column; gap: 3px; width: 60px; }
.ex-icon .typ-line { height: 3px; background: var(--navy); }
.ex-icon .typ-line.short { width: 60%; }
.ex-icon .typ-cursor { width: 2px; height: 14px; background: var(--red); animation: blink 1s step-end infinite; }
@keyframes blink { 50% { opacity: 0; } }
.start-screen { text-align: center; padding: 20px 0; }
.start-screen p { font-size: 0.88rem; color: var(--text-soft); margin-bottom: 20px; }
</style>
</head>
<body>

<header style="padding: 24px 48px; border-bottom: 3px solid var(--navy); display: flex; align-items: center; gap: 10px; background: var(--cream);">
  <svg width="32" height="37" viewBox="0 0 24 28">
    <defs><clipPath id="hHeader"><polygon points="12,1 23,7 23,21 12,27 1,21 1,7"/></clipPath></defs>
    <rect x="0" y="0" width="8" height="28" fill="#002395" clip-path="url(#hHeader)"/>
    <rect x="8" y="0" width="8" height="28" fill="#fff" clip-path="url(#hHeader)"/>
    <rect x="16" y="0" width="8" height="28" fill="#ED2939" clip-path="url(#hHeader)"/>
    <polygon points="12,1 23,7 23,21 12,27 1,21 1,7" fill="none" stroke="#0d2b45" stroke-width="1.5"/>
  </svg>
  <span style="font-family:'Fraunces',serif; font-size:1.9rem; font-weight:700; color:var(--navy);">French with <span style="color:var(--red)">Alban</span></span>
</header>

<div class="wrap" style="padding-top: 40px;">

<h1>Salutations et politesse</h1>

<div class="toggle-row">
  <button class="toggle-btn" data-mode="fr">Français</button>
  <button class="toggle-btn" data-mode="en">Anglais</button>
  <button class="toggle-btn active" data-mode="both">Les deux</button>
</div>

<table id="vocabTable"></table>

<!-- EXERCISE 1 -->
<div class="ex-block">
  <div style="display:flex;align-items:center;gap:16px;">
  <div class="ex-title" style="display:flex;align-items:center;gap:8px;"><svg width="14" height="16" viewBox="0 0 24 28" style="flex-shrink:0; margin-top:-2px;"><defs><clipPath id="hx1"><polygon points="12,1 23,7 23,21 12,27 1,21 1,7"/></clipPath></defs><rect x="0" y="0" width="8" height="28" fill="#002395" clip-path="url(#hx1)"/><rect x="8" y="0" width="8" height="28" fill="#fff" clip-path="url(#hx1)"/><rect x="16" y="0" width="8" height="28" fill="#ED2939" clip-path="url(#hx1)"/><polygon points="12,1 23,7 23,21 12,27 1,21 1,7" fill="none" stroke="#0d2b45" stroke-width="1.5"/></svg><span class="num">1.</span> Choix multiple</div>
  <div class="ex-icon qcm-grid-i"><div class="qcm-i"></div><div class="qcm-i"></div><div class="qcm-i"></div><div class="qcm-i"></div></div>
</div>
  <div class="ex-desc">Choisissez la bonne traduction française.</div>
  <div class="ex-card" id="ex1Root"></div>
</div>

<!-- EXERCISE 2 -->
<div class="ex-block">
  <div style="display:flex;align-items:center;gap:16px;">
  <div class="ex-title" style="display:flex;align-items:center;gap:8px;"><svg width="14" height="16" viewBox="0 0 24 28" style="flex-shrink:0; margin-top:-2px;"><defs><clipPath id="hx2"><polygon points="12,1 23,7 23,21 12,27 1,21 1,7"/></clipPath></defs><rect x="0" y="0" width="8" height="28" fill="#002395" clip-path="url(#hx2)"/><rect x="8" y="0" width="8" height="28" fill="#fff" clip-path="url(#hx2)"/><rect x="16" y="0" width="8" height="28" fill="#ED2939" clip-path="url(#hx2)"/><polygon points="12,1 23,7 23,21 12,27 1,21 1,7" fill="none" stroke="#0d2b45" stroke-width="1.5"/></svg><span class="num">2.</span> Lettres mélangées</div>
  <div class="ex-icon"><div class="scr-i"></div><div class="scr-i"></div><div class="scr-i"></div><div class="scr-i"></div><div class="scr-i"></div></div>
</div>
  <div class="ex-desc">Cliquez sur les lettres dans le bon ordre pour reconstituer le mot français.</div>
  <div class="ex-card" id="ex2Root"></div>
</div>

<!-- EXERCISE 3 -->
<div class="ex-block">
  <div style="display:flex;align-items:center;gap:16px;">
  <div class="ex-title" style="display:flex;align-items:center;gap:8px;"><svg width="14" height="16" viewBox="0 0 24 28" style="flex-shrink:0; margin-top:-2px;"><defs><clipPath id="hx3"><polygon points="12,1 23,7 23,21 12,27 1,21 1,7"/></clipPath></defs><rect x="0" y="0" width="8" height="28" fill="#002395" clip-path="url(#hx3)"/><rect x="8" y="0" width="8" height="28" fill="#fff" clip-path="url(#hx3)"/><rect x="16" y="0" width="8" height="28" fill="#ED2939" clip-path="url(#hx3)"/><polygon points="12,1 23,7 23,21 12,27 1,21 1,7" fill="none" stroke="#0d2b45" stroke-width="1.5"/></svg><span class="num">3.</span> Traduction écrite</div>
  <div class="ex-icon"><div class="typ-i"><div class="typ-line"></div></div><div class="typ-cursor"></div></div>
</div>
  <div class="ex-desc">Écrivez la traduction. Les accents comptent.</div>
  <div class="ex-card" id="ex3Root"></div>
</div>

</div>

<script>
const VOCAB = [
  { fr: "Bonjour", pho: "/bɔ̃.ʒuʁ/", en: "Hello / Good morning" },
  { fr: "Bonsoir", pho: "/bɔ̃.swaʁ/", en: "Good evening" },
  { fr: "Salut", pho: "/sa.ly/", en: "Hi / Bye (informal)" },
  { fr: "Au revoir", pho: "/o ʁə.vwaʁ/", en: "Goodbye" },
  { fr: "À bientôt", pho: "/a bjɛ̃.to/", en: "See you soon" },
  { fr: "S'il vous plaît", pho: "/sil vu plɛ/", en: "Please (formal)" },
  { fr: "Merci beaucoup", pho: "/mɛʁ.si bo.ku/", en: "Thank you very much" },
  { fr: "De rien", pho: "/də ʁjɛ̃/", en: "You're welcome" },
  { fr: "Excusez-moi", pho: "/ɛk.sky.ze mwa/", en: "Excuse me (formal)" },
  { fr: "Pardon", pho: "/paʁ.dɔ̃/", en: "Sorry / Excuse me" },
  { fr: "Comment allez-vous", pho: "/kɔ.mɑ̃ t‿a.le vu/", en: "How are you (formal)" },
  { fr: "Ça va", pho: "/sa va/", en: "How's it going (informal)" },
  { fr: "Enchanté", pho: "/ɑ̃.ʃɑ̃.te/", en: "Nice to meet you" },
  { fr: "Bonne journée", pho: "/bɔn ʒuʁ.ne/", en: "Have a good day" },
];

/* ===== VOCAB TABLE ===== */
const table = document.getElementById('vocabTable');
table.innerHTML = VOCAB.map(v => `<tr><td class="fr">${v.fr}</td><td class="pho">${v.pho}</td><td class="en">${v.en}</td></tr>`).join('');

document.querySelectorAll('.toggle-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.toggle-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    const mode = btn.dataset.mode;
    document.querySelectorAll('.fr').forEach(c => c.classList.toggle('hidden-col', mode === 'en'));
    document.querySelectorAll('.pho').forEach(c => c.classList.toggle('hidden-col', mode === 'en'));
    document.querySelectorAll('.en').forEach(c => c.classList.toggle('hidden-col', mode === 'fr'));
  });
});

function shuffle(arr) { const a=[...arr]; for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; }
function mention(pct) {
  if(pct<50) return {label:"à revoir",cls:"m-revoir"};
  if(pct<60) return {label:"passable",cls:"m-passable"};
  if(pct<70) return {label:"assez bien",cls:"m-assezbien"};
  if(pct<80) return {label:"bien",cls:"m-bien"};
  return {label:"très bien",cls:"m-tresbien"};
}
function normalize(s) { return s.trim().toLowerCase().replace(/\s+/g," "); }

/* ===== EXERCISE 1 : QCM ===== */
let ex1Order = [], ex1Idx = 0, ex1Score = 0, ex1Answered = false, ex1Started = false;
function renderEx1() {
  const root = document.getElementById('ex1Root');
  if (!ex1Started) {
    root.innerHTML = `<div class="start-screen"><p>${VOCAB.length} questions, ordre aléatoire.</p><button class="btn btn-primary" id="ex1Start" style="max-width:200px;margin:0 auto;">Commencer</button></div>`;
    document.getElementById('ex1Start').onclick = () => { ex1Started = true; ex1Order = shuffle(VOCAB); ex1Idx = 0; ex1Score = 0; renderEx1(); };
    return;
  }
  if (ex1Idx >= ex1Order.length) {
    const pct = Math.round((ex1Score/ex1Order.length)*100);
    const m = mention(pct);
    root.innerHTML = `<div class="ex-result"><div class="ex-progress"><span></span><span></span></div>
      <div class="score">${ex1Score} / ${ex1Order.length}</div>
      <span class="mention ${m.cls}">${m.label} — ${pct}%</span><br>
      <div class="ex-actions"><button class="btn btn-primary" id="ex1Retry">Recommencer</button></div></div>`;
    document.getElementById('ex1Retry').onclick = () => { ex1Started = false; renderEx1(); };
    return;
  }
  const q = ex1Order[ex1Idx];
  const wrongPool = VOCAB.filter(v => v.fr !== q.fr);
  const wrongs = shuffle(wrongPool).slice(0,3);
  const options = shuffle([q, ...wrongs]);
  root.innerHTML = `
    <div class="ex-progress"><span>Question ${ex1Idx+1} / ${ex1Order.length}</span><span>Score : ${ex1Score}</span></div>
    <div class="ex-prompt">${q.en}</div>
    <div class="qcm-grid">${options.map(o => `<div class="qcm-opt" data-fr="${o.fr}">${o.fr}</div>`).join('')}</div>`;
  root.querySelectorAll('.qcm-opt').forEach(opt => {
    opt.addEventListener('click', () => {
      if (ex1Answered) return;
      ex1Answered = true;
      const correct = opt.dataset.fr === q.fr;
      if (correct) ex1Score++;
      root.querySelectorAll('.qcm-opt').forEach(o => {
        o.classList.add('disabled');
        if (o.dataset.fr === q.fr) o.classList.add('correct');
        else if (o === opt) o.classList.add('wrong');
      });
      setTimeout(() => { ex1Answered = false; ex1Idx++; renderEx1(); }, 900);
    });
  });
}
renderEx1();

/* ===== EXERCISE 2 : SCRAMBLE ===== */
let ex2Order = [], ex2Idx = 0, ex2Score = 0, ex2Started = false;
let ex2Target = "", ex2Built = [], ex2Letters = [];
function setupEx2Word() {
  const q = ex2Order[ex2Idx];
  ex2Target = q.fr.toLowerCase().replace(/[^a-zàâäéèêëîïôöùûüÿçœ \-']/g, "");
  ex2Built = [];
  ex2Letters = shuffle(ex2Target.split("")).map((ch,i) => ({ch, id:i, used:false}));
}
function renderEx2() {
  const root = document.getElementById('ex2Root');
  if (!ex2Started) {
    root.innerHTML = `<div class="start-screen"><p>${VOCAB.length} mots, ordre aléatoire.</p><button class="btn btn-primary" id="ex2Start" style="max-width:200px;margin:0 auto;">Commencer</button></div>`;
    document.getElementById('ex2Start').onclick = () => { ex2Started = true; ex2Order = shuffle(VOCAB); ex2Idx = 0; ex2Score = 0; setupEx2Word(); renderEx2(); };
    return;
  }
  if (ex2Idx >= ex2Order.length) {
    const pct = Math.round((ex2Score/ex2Order.length)*100);
    const m = mention(pct);
    root.innerHTML = `<div class="ex-result">
      <div class="score">${ex2Score} / ${ex2Order.length}</div>
      <span class="mention ${m.cls}">${m.label} — ${pct}%</span><br>
      <div class="ex-actions"><button class="btn btn-primary" id="ex2Retry">Recommencer</button></div></div>`;
    document.getElementById('ex2Retry').onclick = () => { ex2Started = false; renderEx2(); };
    return;
  }
  const q = ex2Order[ex2Idx];
  root.innerHTML = `
    <div class="ex-progress"><span>Mot ${ex2Idx+1} / ${ex2Order.length}</span><span>Score : ${ex2Score}</span></div>
    <div class="ex-prompt">${q.en}</div>
    <div class="scramble-answer" id="scrAnswer"></div>
    <div class="scramble-letters" id="scrLetters"></div>
    <div class="ex-actions">
      <button class="btn btn-ghost" id="scrClear">Effacer</button>
      <button class="btn btn-primary" id="scrValidate" disabled>Valider</button>
    </div>
    <div id="scrFeedback"></div>`;
  renderScrambleUI();
  document.getElementById('scrClear').onclick = () => { ex2Built=[]; ex2Letters.forEach(l=>l.used=false); renderScrambleUI(); };
  document.getElementById('scrValidate').onclick = validateEx2;
}
function displayChar(ch) { return ch === " " ? "·" : ch; }
function renderScrambleUI() {
  const ans = document.getElementById('scrAnswer');
  const lets = document.getElementById('scrLetters');
  ans.innerHTML = ex2Target.split("").map((_,i) => `<div class="scramble-slot">${ex2Built[i] ? displayChar(ex2Built[i].ch) : ""}</div>`).join('');
  lets.innerHTML = ex2Letters.map(l => `<div class="scramble-letter ${l.used?'used':''}" data-id="${l.id}">${displayChar(l.ch)}</div>`).join('');
  lets.querySelectorAll('.scramble-letter').forEach(el => {
    el.addEventListener('click', () => {
      const id = parseInt(el.dataset.id);
      const letterObj = ex2Letters.find(l => l.id===id);
      if (letterObj.used || ex2Built.length >= ex2Target.length) return;
      letterObj.used = true; ex2Built.push(letterObj);
      renderScrambleUI();
      document.getElementById('scrValidate').disabled = ex2Built.length !== ex2Target.length;
    });
  });
}
function validateEx2() {
  const built = ex2Built.map(l=>l.ch).join("");
  const correct = built === ex2Target;
  if (correct) ex2Score++;
  document.getElementById('scrFeedback').innerHTML = `<div class="feedback ${correct?'ok':'bad'}">${correct?'Correct !':'La bonne orthographe était : <b>'+ex2Order[ex2Idx].fr+'</b>'}</div>`;
  document.getElementById('scrValidate').disabled = true;
  setTimeout(() => { ex2Idx++; setupEx2Word(); renderEx2(); }, 1100);
}
renderEx2();

/* ===== EXERCISE 3 : TYPING ===== */
let ex3Order = [], ex3Idx = 0, ex3Score = 0, ex3Answered = false, ex3Started = false;
let ex3Dir = "en-fr";
const ACCENTS = ["é","è","ê","ë","à","â","î","ï","ô","ù","û","ç","œ"];
function stripAccents(s){ return s.normalize("NFD").replace(/[\u0300-\u036f]/g,""); }
function renderEx3() {
  const root = document.getElementById('ex3Root');
  if (!ex3Started) {
    root.innerHTML = `<div class="start-screen">
      <p>${VOCAB.length} mots, ordre aléatoire. Traduisez de l'anglais vers le français.</p>
      <button class="btn btn-primary" id="ex3Start" style="max-width:200px;margin:0 auto;">Commencer</button></div>`;
    document.getElementById('ex3Start').onclick = () => { ex3Started = true; ex3Order = shuffle(VOCAB); ex3Idx = 0; ex3Score = 0; renderEx3(); };
    return;
  }
  if (ex3Idx >= ex3Order.length) {
    const pct = Math.round((ex3Score/ex3Order.length)*100);
    const m = mention(pct);
    root.innerHTML = `<div class="ex-result">
      <div class="score">${Math.round(ex3Score*10)/10} / ${ex3Order.length}</div>
      <span class="mention ${m.cls}">${m.label} — ${pct}%</span><br>
      <div class="ex-actions"><button class="btn btn-primary" id="ex3Retry">Recommencer</button></div></div>`;
    document.getElementById('ex3Retry').onclick = () => { ex3Started = false; renderEx3(); };
    return;
  }
  const q = ex3Order[ex3Idx];
  const prompt = q.en;
  root.innerHTML = `
    <div class="ex-progress"><span>Mot ${ex3Idx+1} / ${ex3Order.length}</span><span>Score : ${ex3Score}</span></div>
    <div class="ex-prompt">${prompt}</div>
    <div class="type-field">
      <input type="text" id="ex3Input" autocomplete="off" placeholder="Votre réponse...">
      <div class="accent-row">${ACCENTS.map(c=>`<button type="button" class="accent-btn" data-char="${c}">${c}</button>`).join('')}</div>
    </div>
    <div id="ex3Feedback"></div>
    <div class="ex-actions"><button class="btn btn-primary" id="ex3Submit">Valider</button></div>`;
  const input = document.getElementById('ex3Input');
  input.focus();
  root.querySelectorAll('.accent-btn').forEach(b => b.addEventListener('click', () => {
    const s=input.selectionStart??input.value.length, e=input.selectionEnd??input.value.length;
    input.value = input.value.slice(0,s)+b.dataset.char+input.value.slice(e);
    input.focus(); input.setSelectionRange(s+1,s+1);
  }));
  const submit = () => {
    if (ex3Answered) return;
    ex3Answered = true;
    const given = normalize(input.value);
    const target = normalize(q.fr);
    const exact = given === target;
    const accentless = stripAccents(given) === stripAccents(target);
    let points = 0, status;
    if (exact) { points = 1; status = 'ok'; }
    else if (accentless) { points = 0.5; status = 'partial'; }
    else { points = 0; status = 'bad'; }
    ex3Score += points;
    input.classList.add(exact ? 'ok' : (accentless ? 'partial' : 'bad'));
    let msg;
    if (exact) msg = 'Correct !';
    else if (accentless) msg = `Presque ! Attention aux accents — <b>${q.fr}</b> (+0,5 point)`;
    else msg = `Réponse attendue : <b>${q.fr}</b>`;
    document.getElementById('ex3Feedback').innerHTML = `<div class="feedback ${status==='bad'?'bad':'ok'}">${msg}</div>`;
    setTimeout(() => { ex3Answered=false; ex3Idx++; renderEx3(); }, 1300);
  };
  document.getElementById('ex3Submit').onclick = submit;
  input.addEventListener('keydown', e => { if (e.key==="Enter") submit(); });
}
renderEx3();
</script>
</body>
